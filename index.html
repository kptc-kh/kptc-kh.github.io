<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>មជ្ឈមណ្ឌលបណ្តុះបណ្តាលវិជ្ជាជីវៈខេត្តកែប</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef1f6;
    --card: #ffffff;
    --text: #1e2430;
    --muted: #6b7280;
    --accent: #7a1f2b;
    --accent-gold: #b8862c;
    --btn-bg: #f7f8fa;
    --btn-border: #e5e7eb;
    --btn-hover: #eef0f3;
    --shadow: 0 10px 30px rgba(20,20,40,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    background-image: radial-gradient(circle at 50% 0%, #f5f2ea 0%, #eef1f6 55%);
    font-family:'Noto Sans Khmer','Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 16px 60px;
  }
  .card{
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:36px 28px 30px;
    text-align:center;
    border-top:5px solid var(--accent);
  }
  .logo{
    width:108px;
    height:108px;
    object-fit:contain;
    margin-bottom:18px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    line-height:1.5;
    margin:0 0 10px;
    color:var(--accent);
  }
  .subtitle{
    font-size:15px;
    color:var(--muted);
    margin:0 0 28px;
    line-height:1.6;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:var(--btn-bg);
    border:1px solid var(--btn-border);
    border-radius:14px;
    text-decoration:none;
    color:var(--text);
    font-weight:500;
    font-size:16px;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
    text-align:left;
  }
  .btn:hover{
    background:var(--btn-hover);
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(20,20,40,0.08);
  }
  .icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{width:20px;height:20px;}
  .icon.location{background:#fdecec;}
  .icon.facebook{background:#e8eefc;}
  .icon.telegram{background:#e6f4fb;}
  .label{flex:1;}
  .label .en{
    display:block;
    font-size:13px;
    color:var(--muted);
    font-weight:400;
    margin-top:2px;
  }
  .chev{color:#c7cbd3;font-size:16px;}
  .footer{
    margin-top:30px;
    padding-top:20px;
    border-top:1px dashed var(--btn-border);
  }
  .footer .title{
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    margin-bottom:6px;
  }
  .footer .phones{
    font-size:14px;
    color:var(--muted);
    line-height:1.7;
    word-break:break-word;
  }
</style>
</head>
